{% extends "base.html" %}

{% block content %}
<section class="gallery-page" aria-labelledby="gallery-title">
    <div class="section-heading section-heading--wide">
        <p class="eyebrow">GALLERY</p>
        <h1 id="gallery-title">Your voice in visual form.</h1>
        <p>Saved artwork will live here as your collection grows.</p>
    </div>

    <section class="gallery-empty" aria-labelledby="empty-title">
        <div class="gallery-empty__mark" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
        <p class="eyebrow">NOTHING SAVED YET</p>
        <h2 id="empty-title">Make your first piece.</h2>
        <p>Speak for up to 30 seconds and let reotoi translate your voice into art.</p>
        <a class="button button--primary" href="/app">Create artwork</a>
    </section>
</section>
{% endblock %}
