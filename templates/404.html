{% extends "base.html" %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
    <p class="eyebrow">404</p>
    <h1 id="error-title">This voice art does not exist.</h1>
    <p>The artwork you are looking for is not part of reotoi.</p>
    {% if requested_path %}
    <p class="fine-print">{{ requested_path }}</p>
    {% endif %}
    <div class="form-actions">
        <a class="button button--primary" href="/">Back to reotoi</a>
        <a class="button button--secondary" href="/app">Create artwork</a>
    </div>
</section>
{% endblock %}
